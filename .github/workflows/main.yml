
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        run: |
          echo "Repository root:"
          ls -la
          echo "Searching for settings.gradle.kts:"
          find . -name settings.gradle.kts -not -path '*/.gradle/*'

      - name: Build debug APK
        run: |
          FILE="$(find . -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$FILE")"
          echo "Using project directory: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
